<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="220" fill="#ffffff"/>

  <!-- quadro 1 -->
  <rect x="10" y="10" width="180" height="200" fill="none" stroke="#16233b" stroke-width="2"/>
  <circle cx="90" cy="140" r="22" fill="none" stroke="#16233b" stroke-width="2"/>
  <line x1="90" y1="162" x2="90" y2="200" stroke="#16233b" stroke-width="2"/>
  <line x1="90" y1="175" x2="65" y2="195" stroke="#16233b" stroke-width="2"/>
  <line x1="90" y1="175" x2="115" y2="195" stroke="#16233b" stroke-width="2"/>
  <ellipse cx="100" cy="60" rx="75" ry="34" fill="#fff" stroke="#16233b" stroke-width="2"/>
  <path d="M 95 92 L 85 105 L 108 90 Z" fill="#fff" stroke="#16233b" stroke-width="2"/>
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#16233b">"Prezado senhor,</text>
  <text x="100" y="67" text-anchor="middle" font-size="11" fill="#16233b">solicito um</text>
  <text x="100" y="82" text-anchor="middle" font-size="11" fill="#16233b">momento de atenção."</text>

  <!-- quadro 2 -->
  <rect x="210" y="10" width="180" height="200" fill="none" stroke="#16233b" stroke-width="2"/>
  <circle cx="290" cy="140" r="22" fill="none" stroke="#16233b" stroke-width="2"/>
  <line x1="290" y1="162" x2="290" y2="200" stroke="#16233b" stroke-width="2"/>
  <line x1="290" y1="175" x2="265" y2="195" stroke="#16233b" stroke-width="2"/>
  <line x1="290" y1="175" x2="315" y2="195" stroke="#16233b" stroke-width="2"/>
  <ellipse cx="300" cy="58" rx="55" ry="30" fill="#fff" stroke="#16233b" stroke-width="2"/>
  <path d="M 295 88 L 285 100 L 305 86 Z" fill="#fff" stroke="#16233b" stroke-width="2"/>
  <text x="300" y="52" text-anchor="middle" font-size="12" fill="#16233b">"Fala sério?!"</text>
  <text x="300" y="68" text-anchor="middle" font-size="20" fill="#16233b">?!</text>

  <!-- quadro 3 -->
  <rect x="410" y="10" width="180" height="200" fill="none" stroke="#16233b" stroke-width="2"/>
  <circle cx="490" cy="140" r="22" fill="none" stroke="#16233b" stroke-width="2"/>
  <line x1="490" y1="162" x2="490" y2="200" stroke="#16233b" stroke-width="2"/>
  <line x1="490" y1="175" x2="465" y2="195" stroke="#16233b" stroke-width="2"/>
  <line x1="490" y1="175" x2="515" y2="195" stroke="#16233b" stroke-width="2"/>
  <ellipse cx="500" cy="58" rx="70" ry="32" fill="#fff" stroke="#16233b" stroke-width="2"/>
  <path d="M 495 90 L 485 102 L 508 88 Z" fill="#fff" stroke="#16233b" stroke-width="2"/>
  <text x="500" y="50" text-anchor="middle" font-size="11" fill="#16233b">"Ih, meu, relaxa,</text>
  <text x="500" y="65" text-anchor="middle" font-size="11" fill="#16233b">é só um jeito</text>
  <text x="500" y="80" text-anchor="middle" font-size="11" fill="#16233b">de falar."</text>

  <text x="300" y="215" text-anchor="middle" font-size="0" fill="transparent">.</text>
</svg>
