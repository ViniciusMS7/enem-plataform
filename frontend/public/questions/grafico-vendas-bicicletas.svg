<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#16233b">
    Vendas trimestrais de uma loja de bicicletas (2023)
  </text>

  <!-- eixo -->
  <line x1="70" y1="320" x2="560" y2="320" stroke="#16233b" stroke-width="2"/>
  <line x1="70" y1="320" x2="70" y2="60" stroke="#16233b" stroke-width="2"/>

  <!-- linhas guia -->
  <line x1="70" y1="260" x2="560" y2="260" stroke="#dbe6e2" stroke-width="1"/>
  <line x1="70" y1="200" x2="560" y2="200" stroke="#dbe6e2" stroke-width="1"/>
  <line x1="70" y1="140" x2="560" y2="140" stroke="#dbe6e2" stroke-width="1"/>
  <line x1="70" y1="80" x2="560" y2="80" stroke="#dbe6e2" stroke-width="1"/>

  <text x="60" y="325" text-anchor="end" font-size="12" fill="#16233b">0</text>
  <text x="60" y="265" text-anchor="end" font-size="12" fill="#16233b">50</text>
  <text x="60" y="205" text-anchor="end" font-size="12" fill="#16233b">100</text>
  <text x="60" y="145" text-anchor="end" font-size="12" fill="#16233b">150</text>
  <text x="60" y="85" text-anchor="end" font-size="12" fill="#16233b">200</text>

  <!-- barras: 1T 90, 2T 140, 3T 120, 4T 180 (unidades) -->
  <rect x="120" y="212" width="70" height="108" fill="#ff6b4a"/>
  <text x="155" y="335" text-anchor="middle" font-size="13" fill="#16233b">1º trim.</text>
  <text x="155" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#16233b">90</text>

  <rect x="240" y="152" width="70" height="168" fill="#ff6b4a"/>
  <text x="275" y="335" text-anchor="middle" font-size="13" fill="#16233b">2º trim.</text>
  <text x="275" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#16233b">140</text>

  <rect x="360" y="176" width="70" height="144" fill="#ff6b4a"/>
  <text x="395" y="335" text-anchor="middle" font-size="13" fill="#16233b">3º trim.</text>
  <text x="395" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#16233b">120</text>

  <rect x="480" y="104" width="70" height="216" fill="#16233b"/>
  <text x="515" y="335" text-anchor="middle" font-size="13" fill="#16233b">4º trim.</text>
  <text x="515" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#16233b">180</text>

  <text x="300" y="365" text-anchor="middle" font-size="12" fill="#16233b" opacity="0.6">
    Unidades vendidas por trimestre
  </text>
</svg>
